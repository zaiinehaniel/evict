name: Build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Evict.xcodeproj -scheme Evict -configuration Release \
            -derivedDataPath build build

      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/Evict.app Evict.zip

      - uses: actions/upload-artifact@v4
        with:
          name: Evict
          path: Evict.zip
