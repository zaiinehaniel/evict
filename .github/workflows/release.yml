name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    env:
      TAP_DEPLOY_KEY: ${{ secrets.TAP_DEPLOY_KEY }}
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild -project Evict.xcodeproj -scheme Evict -configuration Release \
            -derivedDataPath build \
            MARKETING_VERSION="${GITHUB_REF_NAME#v}" CURRENT_PROJECT_VERSION="${GITHUB_RUN_NUMBER}" \
            build

      - name: Package
        run: ditto -c -k --keepParent build/Build/Products/Release/Evict.app Evict.zip

      - uses: softprops/action-gh-release@v2
        with:
          files: Evict.zip
          generate_release_notes: true

      # Point the Homebrew cask (zaiinehaniel/homebrew-tap) at this release.
      # Uses a deploy key that can only write to the tap repository.
      - name: Update Homebrew cask
        if: ${{ env.TAP_DEPLOY_KEY != '' }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          SHA256=$(shasum -a 256 Evict.zip | cut -d' ' -f1)
          mkdir -p ~/.ssh
          printf '%s\n' "$TAP_DEPLOY_KEY" > ~/.ssh/tap_key
          chmod 600 ~/.ssh/tap_key
          export GIT_SSH_COMMAND="ssh -i ~/.ssh/tap_key -o StrictHostKeyChecking=accept-new"
          git clone git@github.com:zaiinehaniel/homebrew-tap.git tap
          cd tap
          sed -i '' -e "s/^  version \".*\"/  version \"$VERSION\"/" \
                    -e "s/^  sha256 \".*\"/  sha256 \"$SHA256\"/" Casks/evict.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "evict $VERSION"
          git push
